version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: imgcompress
build:
  toolchains: []
  run_buildscript: false
images:
  - id: imgcompress
    target: service
    service: imgcompress
    source: docker.io/karimz1/imgcompress
    channel: custom
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+(-rc[.][0-9]+)?$
    version_regex: ^(?P<version>v?[0-9]+[.][0-9]+[.][0-9]+(-rc[.][0-9]+)?)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: imgcompress
    skip_if_version_exists: true
